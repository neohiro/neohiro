# --- Tools ------------------------------------------------------------------
#
# `slug` is the _tools/<slug>.md filename, which is also the permalink segment
# (/tools/<slug>/). `keywords` here are ADDITIONAL, tool-specific queries that
# the topical clusters above do not cover. They end up in that tool's JSON-LD
# `keywords` and in llms-full.txt.
#
# Only entries whose file actually exists in _tools/ are emitted; build_seo.py
