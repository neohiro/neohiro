  - id: mesh-networking
    label: "LoRa mesh networking"
    claim: live
    page: "/tools/mesh-vanity-key/"
    summary: >-
      In-browser Ed25519 vanity key generation for LoRa mesh networks:
      MeshCore device keys, Meshtastic channel PSKs and node IDs.
    keywords:
      - "lora"
