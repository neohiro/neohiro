<!-- counter-widget.html — unified visitor counter partial for the neohiro/FPM/OSI/H+ Jekyll sites.
   Include with:   include counter-widget.html

   READ THIS BEFORE EDITING THE LINES BELOW.

   This header is a Liquid tag comment, delimited by a hash-brace at the open and
   a hash-brace at the close. It ends at the FIRST closing delimiter it meets.
   It therefore CANNOT contain a Liquid tag, and it cannot even contain a written
   example of a closing delimiter, because that example would close the comment
   early and everything after it would be parsed as template.

   That is not a theoretical hazard. This file previously carried its usage line
   as a real, braced include tag. Because it sat inside this comment, Liquid
   parsed it as a genuine include OF THIS FILE, recursed until the stack blew,
   and the whole site failed to build with a "stack level too deep" error naming
   _layouts/default.html - four levels away from the file actually at fault. It
   stayed invisible for as long as no page reached this partial; moving the
   counter into a hero is what finally exposed it.

   So: describe include usage in words, as above. Never write a braced Liquid tag
   or a closing delimiter anywhere in this header. The same trap is documented in
   svg-icon.html in this directory, and the FPM copy of this file.

   Reads the visitor path from site config (preferred) or a local override:
     - site.counter_path (set in _config.yml) — auto-populated for all sites
     - include counter_path="..."           — manual override (rare)
   The embed:
     - Uses a visitor-badge image (no JS; Camo/GitHub-safe)
     - Wraps in a div align=center for visual consistency
     - Wraps in a no-referrer rel="noopener noreferrer nofollow" link for accessibility
     - paths live in links-secret / visitor-counters.spec.yaml (SSOT)
   Architecture (per AGENTS.md section template-shared):
     1. Authoritative source: template-shared/_includes/counter-widget.html
     2. Synced to 4 sites via template-shared/sync-shared.sh
     3. Sites expose counter_path via _config.yml (site.counter_path)
     4. Validator + CI ensure no other embed pattern ships.
   NOTE: freevisitorcounters was retired from embeds (JS-dependent, broken on
   GitHub). Visitor badges render a static SVG, so they work everywhere.
-->
{%- assign _path = include.counter_path | default: site.counter_path -%}
{%- if _path -%}
<div align="center">
  <a href="https://visitorbadge.io/status?path={{ _path | cgi_escape }}" rel="noopener noreferrer nofollow">
    <img src="https://api.visitorbadge.io/api/visitors?path={{ _path | cgi_escape }}&label=Visitors&countColor=%23263759" alt="Visitors" />
  </a>
</div>
{%- endif -%}
