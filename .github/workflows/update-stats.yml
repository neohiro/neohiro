name: Update stats cards

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate stat cards from live data
        env:
          GH_TOKEN: ${{ github.token }}
        run: python update_stats.py

      - name: Commit refreshed cards
        run: |
          git config user.name "stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg langs.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh stat cards"
            git push
          fi